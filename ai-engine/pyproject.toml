[project]
name = "spark-ai-engine"
version = "0.1.0"
description = "SPARK AI - LLM RAG Celery Worker"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "SPARK AI Team" }
]
dependencies = [
    # Task Queue
    "celery[redis]>=5.4.0",
    # Config
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.1.0",
    # LLM Orchestration
    "langgraph>=0.2.70",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    # Local Ollama (LLM + Embeddings)
    "langchain-ollama>=0.2.0",
    # Google Gemini (free-tier embeddings alternative — no credit card required)
    # Remove if using Ollama embeddings exclusively.
    "google-generativeai>=0.8.0",
    # Vector DB
    "qdrant-client>=1.14.0",
    # HTTP client (for backend report POST)
    "httpx>=0.28.1",
    # Logging
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]

# ---------------------------
# ruff
# ---------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ---------------------------
# Pytest
# ---------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engine"]
