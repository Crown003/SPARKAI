[project]
name = "spark-analysis-engine"
version = "0.1.0"
description = "SPARK AI - Static Analysis Celery Worker"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "SPARK AI Team" }
]
dependencies = [
    # Task Queue
    "celery[redis]>=5.4.0",
    # Config
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.1.0",
    # Static Analysis
    "radon>=6.0.1",
    "bandit>=1.8.0",
    # Repo Cloning
    "gitpython>=3.1.44",
    # Logging
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
]

# ---------------------------
# ruff
# ---------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ---------------------------
# Pytest
# ---------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis_engine"]
