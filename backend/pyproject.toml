[project]
name = "spark-ai-backend"
version = "0.1.0"
description = "SPARK AI - Engineering Readiness Analyzer Backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "SPARK AI Team" }
]
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt==3.2.2",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "passlib>=1.7.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
    "pytest-cov>=7.0.0",
]


# ---------------------------
# ruff
# ---------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

# -----------------------------
# MyPy
# -----------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

# -----------------------------
# Pytest
# -----------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests"
]

# -----------------------------
# Coverage
# -----------------------------
[tool.coverage.run]
source = [
    "app"
]

[tool.coverage.report]
show_missing = true
skip_covered = true
